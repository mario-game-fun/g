<!DOCTYPE html>
<html>

<head>
    <script src="https://mario-game-fun.github.io/g/snes/gameframe/ruffle/2024-07-01/ruffle.js"></script>

<body style="margin: 0px; overflow: hidden;">
    <div id="container" style="width: 100vw; height: 100vh"></div>
    <script type="text/javascript">function play() {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            player.config = { "contextMenu": "off", "autoplay": true, "warnOnUnsupportedContent": false, "allowScriptAccess": true, "maxExecutionDuration": 30 }
            const container = document.getElementById('container');
            container.appendChild(player);
            player.style.cssText = 'width:100%; height: 100%;';
            player.style.display = 'block';
            player.load( window.location.href +"/data.swf");
        }
        play();</script>
    <script type="text/javascript" src="https://mario-game-fun.github.io/g/snes/gameframe/sdk/codea.js"></script>
</body>
</head>

</html>
